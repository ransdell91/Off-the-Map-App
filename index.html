var tipEl=document.getElementById('tip'), hoverT=null, lpT=null, lpFired=false, sx=0, sy=0;
function tipTarget(n){return n&&n.closest?n.closest('[data-tip]'):null;}
function showTip(el){
  var t=el.getAttribute('data-tip'); if(!t||!document.body.contains(el))return;
  tipEl.textContent=t; tipEl.hidden=false;
  var r=el.getBoundingClientRect(), w=tipEl.offsetWidth, h=tipEl.offsetHeight, vw=document.documentElement.clientWidth;
  var x=Math.min(Math.max(8,r.left+r.width/2-w/2),vw-w-8), y=r.top-h-8; if(y<8)y=r.bottom+8;

function hideTip(){clearTimeout(hoverT);tipEl.hidden=true;}
document.addEventListener('pointerover',function(e){if(e.pointerType!=='mouse')return;var el=tipTarget(e.target);clearTimeout(hoverT);if(!el){hideTip();return;}hoverT=setTimeout(function(){showTip(el);},350);});

  var el=tipTarget(e.target); if(!el)return;

},true);
document.addEventListener('pointermove',function(e){if(lpT&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)){clearTimeout(lpT);lpT=null;}},true);

/* day changes: the page follows your finger; the next or previous page slides in beside it */

function makePeek(dir){

function setX(x,anim){

  if(w){w.style.transition=tr;w.style.transform='translate3d('+x+'px,0,0)';}
  if(p){p.style.transition=tr;p.style.transform='translate3d('+(x+(PG.dir>0?W:-W))+'px,0,0)';}
}

function finishPage(dir){

  PG.busy=true; var fresh=!(PG.peek&&PG.dir===dir); makePeek(dir); if(fresh)setX(0,false);
  requestAnimationFrame(function(){requestAnimationFrame(function(){setX(dir>0?-W:W,true);});});
  var done=false;function end(){if(done)return;done=true;PG.busy=false;var m=pageMut(dir);clearPeek();m();main.scrollTop=0;render();}
  var p=PG.peek; p.addEventListener('transitionend',end,{once:true}); setTimeout(end,320);
}

  var done=false;function end(){if(done)return;done=true;PG.busy=false;clearPeek();setDay(d);render();}

mainEl.addEventListener('touchstart',function(e){
  sw=null; var rv=route().v; if((rv!=='today'&&rv!=='calendar')||e.touches.length!==1||S.ui.add||PG.busy)return;
  if(e.target.closest('.chips,.weekscroll,input,textarea,select'))return;
  sw={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),lock:null,dx:0,lastX:e.touches[0].clientX,lastT:Date.now(),v:0};
},{passive:true});
mainEl.addEventListener('touchmove',function(e){
  if(!sw||lpFired)return; var t=e.touches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y;
  if(sw.lock===null){if(Math.abs(dx)<8&&Math.abs(dy)<8)return; sw.lock=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y'; if(sw.lock==='x')hideTip();}
  if(sw.lock!=='x')return;
  e.preventDefault();
  var now=Date.now(); sw.v=(t.clientX-sw.lastX)/Math.max(1,now-sw.lastT); sw.lastX=t.clientX; sw.lastT=now;
  sw.dx=dx; if(dx===0)return;
  makePeek(dx<0?1:-1); setX(dx,false);
},{passive:false});
function swEnd(){
  if(!sw)return; var s=sw; sw=null;
  if(s.lock!=='x'){return;}
  var W=mainEl.clientWidth, dir=s.dx<0?1:-1;
  var fling=Math.abs(s.v)>0.45&&(s.v<0?1:-1)===dir;
  if(Math.abs(s.dx)>W*0.28||fling){
    PG.busy=true; makePeek(dir); setX(dir>0?-W:W,true);
    var done=false;function end(){if(done)return;done=true;PG.busy=false;var m=pageMut(dir);clearPeek();m();mainEl.scrollTop=0;render();}
    PG.peek.addEventListener('transitionend',end,{once:true}); setTimeout(end,320);
  } else cancelPage();
}
mainEl.addEventListener('touchend',swEnd,{passive:true});
mainEl.addEventListener('touchcancel',function(){if(sw&&sw.lock==='x'){sw=null;cancelPage();}else sw=null;},{passive:true});

/* events */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b||b.disabled)return;
  var act=b.getAttribute('data-act'), id=b.getAttribute('data-id'), k=b.getAttribute('data-k'), col=b.getAttribute('data-col')||'episodes';
  hideTip();
  if(act==='closeadd'){ if(b.classList.contains('scrim')&&ev.target!==b)return; S.ui.add=null; render(); return; }
  if(act==='add'){var r=route();var d0=(r.v==='today'&&S.ui.day&&S.ui.day>today())?S.ui.day:null;S.ui.add={kind:k||'task',ep:(r.v==='episode'?r.id:''),idea:(r.v==='idea'?r.id:''),day:null,day0:d0,text:''};render();setTimeout(function(){var t=document.getElementById('qa-text');if(t)t.focus();},30);return;}
  if(act==='addkind'){keepText();S.ui.add.kind=k;render();return;}
  if(act==='addday'){keepText();S.ui.add.day=k;render();return;}
  if(act==='task'){var t=S.tasks[id];if(!t)return;t.done=!t.done;render();write('tasks/'+id,{done:t.done});return;}
  if(act==='owner'){var t2=S.tasks[id];if(!t2)return;var nx={producer:'host',host:'both',both:'producer'}[t2.who||'both']||'producer';t2.who=nx;render();write('tasks/'+id,{who:nx},'Reassigned to '+whoName(nx));return;}
  if(act==='gate'){var e=(S[col]||{})[id];if(!e)return;e.gate=Object.assign({},e.gate);e.gate[k]=!e.gate[k];render();var p={gate:{}};p.gate[k]=e.gate[k];write(col+'/'+id,p);return;}
  if(act==='advance'){var e2=S.episodes[id];if(!e2)return;var n=STAGES[sIdx(e2.stage||'greenlit')+1];if(!n)return;e2.stage=n;render();write('episodes/'+id,{stage:n},'Moved to '+STAGE_NAME[n]);return;}
  if(act==='delshot'){var e3=(S[col]||{})[id];if(!e3)return;var sh=(e3.shots||[]).slice();sh.splice(+k,1);e3.shots=sh;render();write(col+'/'+id,{shots:sh});return;}
  if(act==='pack'){var tr=S.trips[id];tr.pack=Object.assign({},tr.pack);tr.pack[k]=!tr.pack[k];render();var pp={pack:{}};pp.pack[k]=tr.pack[k];write('trips/'+id,pp);return;}
  if(act==='prompt'){if(!S.settings)return;var P=Object.assign({},S.settings.prompts);P[k]=!P[k];S.settings=Object.assign({},S.settings,{prompts:P});render();var q={prompts:{}};q.prompts[k]=P[k];write('config/settings',q);return;}
  if(act==='readall'){vals(S.prompts).forEach(function(p){if(!p.read){p.read=true;write('prompts/'+p.id,{read:true});}});render();return;}
  if(act==='greenlight'){var i=S.ideas[id];if(!i)return;var mx=queued().reduce(function(m,x){return Math.max(m,x.queue||0);},0);i.status='greenlit';i.queue=mx+1;i.greenlitAt=new Date().toISOString();render();write('ideas/'+id,{status:'greenlit',queue:i.queue,greenlitAt:i.greenlitAt},'Greenlit. Number '+queuePos(i)+' in the queue.');return;}
  if(act==='unqueue'){var i2=S.ideas[id];if(!i2)return;i2.status='idea';i2.queue=null;render();write('ideas/'+id,{status:'idea',queue:null},'Taken out of the queue');return;}
  if(act==='qmove'){var ql=queued(),ix=-1;ql.forEach(function(x,n){if(x.id===id)ix=n;});var j=ix+(+k);if(ix<0||j<0||j>=ql.length)return;var tmp=ql[ix];ql[ix]=ql[j];ql[j]=tmp;ql.forEach(function(x,n){if(x.queue!==n+1){x.queue=n+1;write('ideas/'+x.id,{queue:n+1});}});render();return;}
  if(act==='who'){setWho(k);render();return;}
  if(act==='go'){if(k==='calendar')S.ui.calMonth=(S.ui.day||today()).slice(0,8)+'01';if(location.hash==='#'+k)render();else location.hash='#'+k;return;}
  if(act==='setday'){jumpToDay(k);return;}
  if(act==='shiftday'){shiftDay(+k);return;}
  if(act==='pickday'){setDay(k);if(location.hash==='#today')render();else location.hash='#today';return;}
  if(act==='calmonth'){if(k==='0'){S.ui.calMonth=today().slice(0,8)+'01';render();}else shiftMonth(+k);return;}
  if(act==='rtab'){S.ui.runwayTab=k;render();return;}
  if(act==='epstage'){S.ui.epStage=k;render();return;}
  if(act==='epsel'){S.ui.epSel=id;S.ui.epTab='overview';render();return;}
  if(act==='eptab'){S.ui.epTab=k;render();return;}
  if(act==='iseries'){S.ui.ideaSeries=k;render();return;}
  if(act==='trip'){S.ui.trip=id;render();var m=document.getElementById('main');if(m)m.scrollTop=0;return;}
});
function keepText(){var t=document.getElementById('qa-text');if(t&&S.ui.add)S.ui.add.text=t.value;var w=document.getElementById('qa-who');if(w&&S.ui.add)S.ui.add.who=w.value;}
document.addEventListener('input',function(ev){
  var k=ev.target.getAttribute('data-input'); if(!k)return;
  if(k==='epq'){S.ui.epQuery=ev.target.value;render();}
  if(k==='iq'){S.ui.ideaQuery=ev.target.value;render();}
});
document.addEventListener('submit',function(ev){
  var f=ev.target.closest('[data-form]'); if(!f)return; ev.preventDefault();
  var kind=f.getAttribute('data-form');
  if(kind==='shot'){var col=f.getAttribute('data-col')||'episodes';var inp=f.querySelector('input');var v=inp.value.trim();if(!v)return;var e=(S[col]||{})[f.getAttribute('data-id')];if(!e)return;var sh=(e.shots||[]).concat([v]);e.shots=sh;inp.value='';render();write(col+'/'+e.id,{shots:sh});var ni=document.getElementById('shot-in');if(ni)ni.focus();return;}
  if(kind==='add'){
    var a=S.ui.add, text=(document.getElementById('qa-text').value||'').trim(); if(!text){toast('Type something first.');return;}
    var epSel=document.getElementById('qa-ep'), serSel=document.getElementById('qa-ser'), whoSel=document.getElementById('qa-who');
    var ep=epSel?epSel.value:'', idea=a.idea&&S.ideas[a.idea]?a.idea:'';
    if(a.kind==='task'){create('tasks',{title:text,who:whoSel?whoSel.value:'both',episode:idea?'':ep,idea:idea,day:a.day,stage:idea?'Idea':(ep&&S.episodes[ep]?STAGE_NAME[planned(S.episodes[ep],a.day)]:'General'),mins:30,done:false},'Task added for '+fmt(a.day));}
    else if(a.kind==='idea'){create('ideas',{title:text,hook:'',series:serSel.value,region:'',mode:'',trip:'',season:'',status:'idea',episode:''},'Idea saved');}
    else {var col2=idea?'ideas':'episodes', tid=idea||ep, e2=(S[col2]||{})[tid];
      if(e2){if(a.kind==='shot'){var s2=(e2.shots||[]).concat([text]);e2.shots=s2;write(col2+'/'+tid,{shots:s2},'Shot added');}
      else {var nt=(e2.notes?e2.notes+'\n':'')+text;e2.notes=nt;write(col2+'/'+tid,{notes:nt},'Note added');}}}
    S.ui.add=null;render();
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){hideTip();if(S.ui.add){S.ui.add=null;render();}return;}
  if((ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&route().v==='calendar'&&!S.ui.add&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')){shiftMonth(ev.key==='ArrowRight'?1:-1);return;}
  if((ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&route().v==='today'&&!S.ui.add&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')){shiftDay(ev.key==='ArrowRight'?1:-1);}
});
window.addEventListener('hashchange',function(){S.ui.epTab='overview';hideTip();render();var m=document.getElementById('main');if(m)m.scrollTop=0;});
var lastWide=null;window.addEventListener('resize',function(){var w=wide();if(w!==lastWide){lastWide=w;render();}});
lastWide=wide();
S.ui.who=getWho();
render();
start();
var APP_VERSION='5';
/* Updates: check for a new version whenever the app comes back to the front, and reload into it automatically. */
if('serviceWorker' in navigator){
  var hadCtrl=!!navigator.serviceWorker.controller, reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadCtrl){hadCtrl=true;return;}if(reloading||PG.busy||S.ui.add)return;reloading=true;location.reload();});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(reg){
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update().catch(function(){});});
    setInterval(function(){reg.update().catch(function(){});},30*60*1000);
  }).catch(function(){});});
}
})();

</script>
